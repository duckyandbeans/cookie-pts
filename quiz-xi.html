            { id: 'passage', type: 'reading_passage', title: 'Reading Passage for questions 21 – 30', content: `The Altan community, residing in a remote mountain region, exemplifies the critical intersection of environmental degradation and human well-being. For decades, this ethnic group has practiced subsistence farming on largely unfertile land, a struggle exacerbated by severe soil erosion and recurrent droughts. The proximity of a newly established industrial zone, a significant emitter of pollutants, has led to visibly poor air pollution and concerns over contaminated sewage affecting their water sources. This harsh environment contributes directly to widespread poverty and malnutrition, with unemployment rates soaring as traditional livelihoods become untenable. The average wage for those who find work is far below the national gross domestic product per capita, forcing many into precarious housing situations. In response, a multi-disciplinary team from a leading university has initiated a long-term study. The project’s stringent entry requirements attract top undergraduate students, many on scholarship, who work alongside senior researchers. Their mission is twofold: to find sustainable solutions for the environmental crisis, such as promoting biodegradable alternatives to plastic refuse, and to document the physiological impact on the residents. The team’s research aims to provide clear evidence of the challenges, moving beyond simple correlation to find causal data linking the environmental toxins to health outcomes. Early findings from the medical research arm are alarming. MRI scanning of adolescents has revealed potential alterations in white/grey matter, suggesting that chronic malnutrition during childhood and puberty may impact neurodevelopment. This could have lifelong consequences for cognition and overall lifespan. Furthermore, the constant struggle for survival appears to disrupt fundamental adaptive biological processes, including the circadian rhythm, leading to poor sleep and cognitive fatigue. The researchers believe that without intervention, the community’s poor academic performance and limited career prospects will persist, trapping the next generation in a cycle of poverty. The university team hopes their work will not only stabilize the local ecosystem but also provide a model for interventions in similar communities globally.`},

        let userAnswers = {};
        const quizContainer = document.getElementById('quiz-container');
        let currentSectionTitle = null;

        function renderQuiz() {
            quizContainer.innerHTML = '';
            QUIZ_DATA.forEach(item => {
                if (item.section && item.section !== currentSectionTitle) {
                    currentSectionTitle = item.section;
                    quizContainer.innerHTML += `<h2 class="text-xl sm:text-2xl font-bold text-indigo-700 mt-10 mb-4 border-b-2 border-indigo-200 pb-2">${currentSectionTitle}</h2>`;
                }
                if (item.type === 'reading_passage') {
                    quizContainer.innerHTML += `
                        <div class="mb-8 p-6 bg-gray-50 rounded-xl shadow-inner">
                            <h3 class="text-xl font-semibold mb-3 text-gray-800">${item.title}</h3>
                            <div class="passage-container text-gray-700 text-sm sm:text-base leading-relaxed">
                                <p>${item.content.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                const questionNumber = item.id;
                const questionHtml = item.type === 'error_analysis' ? `${questionNumber}. ${item.question}` : `<p class="font-medium text-gray-800">${questionNumber}. ${item.question}</p>`;
                let optionsHtml = '';
                if (item.type === 'error_analysis') {
                    for (const letter in item.options) { optionsHtml += createOptionHtml(questionNumber, letter, `${letter}) ${item.options[letter]}`); }
                } else if (item.type === 'multiple_choice') {
                    item.options.forEach(optionText => {
                        const letter = optionText.charAt(0);
                        const text = optionText.substring(3).trim();
                        optionsHtml += createOptionHtml(questionNumber, letter, `${letter}. ${text}`);
                    });
                }
                quizContainer.innerHTML += `
                    <div id="q-${questionNumber}" class="bg-white p-5 rounded-xl shadow-md border border-gray-200 fade-in" data-type="${item.type}">
                        <div class="text-base text-gray-600 mb-6 leading-relaxed">${questionHtml}</div>
                        <div class="space-y-3 mt-4" data-question-id="${questionNumber}">${optionsHtml}</div>
                        ${item.type === 'error_analysis' ? '<div class="mt-8 text-sm text-gray-500 font-medium">The error label (A, B, C, D) is underlined above. Select (E) if there is no error.</div>' : ''}
                    </div>
                `;
            });
            quizContainer.innerHTML += `
                <button onclick="checkAllAnswers()" class="w-full py-3 mt-12 mb-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-150 ease-in-out">
                    Check All Answers & Get Score
                </button>
            `;
            attachEventListeners();
        }

        function createOptionHtml(qId, letter, text) {
            return `
                <div class="quiz-option p-3 rounded-lg border-2 border-gray-300 flex items-center" data-question="${qId}" data-answer="${letter}">
                    <span class="text-sm font-semibold text-gray-800">${text}</span>
                </div>
            `;
        }

        function attachEventListeners() {
            document.querySelectorAll('.quiz-option').forEach(option => {
                option.addEventListener('click', handleOptionClick);
            });
            document.getElementById('results-section').classList.add('hidden');
        }

        function handleOptionClick(event) {
            const selectedOption = event.currentTarget;
            const qId = selectedOption.dataset.question;
            const answerLetter = selectedOption.dataset.answer;
            const container = selectedOption.closest(`[data-question-id="${qId}"]`);
            const questionCard = document.getElementById(`q-${qId}`);
            container.querySelectorAll('.quiz-option').forEach(option => { option.classList.remove('selected', 'correct', 'incorrect'); });
            selectedOption.classList.add('selected');
            userAnswers[qId] = answerLetter;
            if (questionCard.dataset.type === 'error_analysis') {
                questionCard.querySelectorAll('.error-part').forEach(part => {
                    part.querySelector('.error-underline').classList.remove('text-red-600', 'text-green-600');
                    part.querySelector('.error-label').classList.remove('text-red-600', 'text-green-600');
                    part.querySelector('.error-label').classList.add('text-indigo-600');
                });
            }
        }

        function checkAllAnswers() {
            let correctCount = 0;
            let totalQuestions = 0;
            for (const qId in CORRECT_ANSWERS) {
                totalQuestions++;
                const correctAnswer = CORRECT_ANSWERS[qId];
                const userAnswer = userAnswers[qId];
                const questionCard = document.getElementById(`q-${qId}`);
                if (!questionCard) continue;
                const optionsContainer = questionCard.querySelector(`[data-question-id="${qId}"]`);
                optionsContainer.querySelectorAll('.quiz-option').forEach(option => { option.classList.remove('correct', 'incorrect', 'selected'); });
                if (userAnswer) {
                    const isCorrect = userAnswer === correctAnswer;
                    const selectedOption = optionsContainer.querySelector(`[data-answer="${userAnswer}"]`);
                    if (selectedOption) {
                        selectedOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                        if (isCorrect) correctCount++;
                    }
                    if (questionCard.dataset.type === 'error_analysis') {
                        questionCard.querySelectorAll('.error-part').forEach(part => {
                            part.querySelector('.error-underline').classList.remove('text-red-600', 'text-green-600');
                            part.querySelector('.error-label').classList.remove('text-red-600', 'text-green-600');
                            part.querySelector('.error-label').classList.add('text-indigo-600');
                        });
                        const correctPart = questionCard.querySelector(`[data-part="${correctAnswer}"] .error-underline`);
                        const correctLabel = questionCard.querySelector(`[data-part="${correctAnswer}"] .error-label`);
                        if (correctPart) {
                            correctPart.classList.add('text-green-600');
                            correctLabel.classList.remove('text-indigo-600');
                            correctLabel.classList.add('text-green-600');
                        }
                        if (!isCorrect && userAnswer !== 'E') {
                            const incorrectPart = questionCard.querySelector(`[data-part="${userAnswer}"] .error-underline`);
                            const incorrectLabel = questionCard.querySelector(`[data-part="${userAnswer}"] .error-label`);
                            if (incorrectPart) {
                                incorrectPart.classList.add('text-red-600');
                                incorrectLabel.classList.remove('text-indigo-600');
                                incorrectLabel.classList.add('text-red-600');
                            }
                        }
                    }
                }
                if (userAnswers[qId] !== correctAnswer) {
                    const correctOption = optionsContainer.querySelector(`[data-answer="${correctAnswer}"]`);
                    if (correctOption) correctOption.classList.add('correct');
                }
            }
            const scoreDisplay = document.getElementById('score-display');
            const resultsSection = document.getElementById('results-section');
            scoreDisplay.textContent = `${correctCount} / ${totalQuestions} (${((correctCount / totalQuestions) * 100).toFixed(1)}%)`;
            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
