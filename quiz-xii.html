<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced XII Grade Mock Exam Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .quiz-option { transition: all 0.2s; cursor: pointer; word-break: break-word; }
        .quiz-option:hover:not(.selected):not(.correct):not(.incorrect) { background-color: #eef2ff; }
        .selected { border-color: #4f46e5; background-color: #e0e7ff; }
        .correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .passage-container { max-height: 400px; overflow-y: auto; border-radius: 0.5rem; border: 1px solid #d1d5db; padding: 1rem; background-color: #ffffff; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <a href="index.html" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 font-semibold mb-6">
            &larr; Back to Home Menu
        </a>

        <header class="text-center mb-10 p-6 bg-indigo-600 text-white rounded-xl shadow-lg">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">XII Grade Mock Exam Practice (Advanced)</h1>
            <p class="text-lg font-light mt-1 opacity-90">Reading Comprehension, Vocabulary, and Grammar</p>
        </header>

        <main id="quiz-container" class="space-y-8">
            </main>

        <div id="results-section" class="mt-10 p-6 bg-white border-t-4 border-indigo-500 rounded-xl shadow-lg hidden fade-in">
            <h2 class="text-2xl font-bold text-indigo-700 mb-4">Quiz Results</h2>
            <p class="text-gray-700">Your current score is: <span id="score-display" class="text-indigo-600 font-extrabold text-xl"></span></p>
            <p class="text-sm text-gray-500 mt-2">Check the colored boxes above for question-by-question feedback.</p>
        </div>
    </div>

    <script>
        const CORRECT_ANSWERS = {
            1: 'B', 2: 'C', 3: 'A', 4: 'C', 5: 'D', 6: 'B', 7: 'C', 8: 'C', 9: 'D', 10: 'C',
            11: 'B', 12: 'B', 13: 'C', 14: 'D', 15: 'B', 16: 'D', 17: 'E', 18: 'A', 19: 'D', 20: 'D',
            21: 'C', 22: 'D', 23: 'C', 24: 'D', 25: 'C', 26: 'C', 27: 'D', 28: 'B', 29: 'C', 30: 'D',
            31: 'C', 32: 'B', 33: 'C', 34: 'C', 35: 'C', 36: 'D', 37: 'C', 38: 'B', 39: 'B', 40: 'C'
        };

        const QUIZ_DATA = [
            { id: 'passage1', type: 'reading_passage', title: 'Reading Comprehension Passage 1: AI in Education', content: `The rapid integration of Artificial Intelligence (AI) into educational systems is fundamentally reshaping the learning landscape. Initially perceived as a distant technology, AI tools are now commonplace, offering personalized learning experiences and automating administrative tasks for educators. While proponents hail AI's potential to tailor curriculum to individual student needs and provide instant feedback, the transformation is not without its critics.\nA core debate revolves around the future role of the teacher. Some suggest AI could replace human instruction, but a more widely accepted view is that technology should augment, not supplant, the educator. AI is proving particularly effective in rote tasks, data analysis, and generating practice problems, thus freeing up teachers to focus on complex skills like critical thinking, collaboration, and emotional development.\nThe ethical considerations of using AI in schools are also paramount. Concerns include data privacy, algorithmic bias, and the potential for a "digital divide" where students from less privileged backgrounds lack access to necessary hardware or connectivity. Successful implementation requires careful policy development to ensure equity and transparency.\nUltimately, the goal is not simply to adopt new technology, but to leverage AI to create a more effective, engaging, and equitable educational environment. It demands ongoing professional development for teachers and open dialogue among all stakeholders.`},
            { id: 1, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'The widely accepted view is that AI should replace human instruction in education.', options: ['A. TRUE', 'B. FALSE', 'C. NOT GIVEN', 'D. ONLY TRUE FOR ROTE TASKS', 'E. ONLY FALSE FOR CRITICAL THINKING'] },
            { id: 2, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'Green buildings are more expensive to construct than traditional buildings.', options: ['A. TRUE', 'B. FALSE', 'C. NOT GIVEN', 'D. ONLY TRUE FOR ENERGY EFFICIENCY', 'E. ONLY FALSE FOR WATER CONSUMPTION'] },
            { id: 3, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'The successful integration of AI requires that teachers have ongoing professional training.', options: ['A. TRUE', 'B. FALSE', 'C. NOT GIVEN', 'D. ONLY TRUE FOR HIGH SCHOOL TEACHERS', 'E. ONLY FALSE FOR UNIVERSITY PROFESSORS'] },
            { id: 4, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'What is the main idea of the first paragraph?', options: ['A. AI is a distant technology criticized by most educators.', 'B. The transformation to AI is solely driven by personalized learning experiences.', 'C. The rapid integration of AI is fundamentally reshaping learning through personalization and automation.', 'D. The only use for AI is automating administrative tasks for teachers.', 'E. Critics have successfully stopped the adoption of AI in schools.'] },
            { id: 5, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'What can be inferred about the tasks AI is not primarily responsible for in the classroom?', options: ['A. Data analysis and report generation.', 'B. Providing instant feedback to students.', 'C. Automating administrative tasks for educators.', 'D. Developing students’ critical thinking and emotional skills.', 'E. Generating practice problems for core subjects.'] },
            { id: 6, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'How does the third paragraph relate to the second paragraph?', options: ['A. It contrasts the effectiveness of AI in rote tasks with its failure in complex skills.', 'B. It introduces the policy requirements needed to manage the challenges of AI augmentation.', 'C. It provides a new argument suggesting AI is too biased to be used effectively.', 'D. It criticizes the focus on emotional development mentioned in the previous section.', 'E. It argues that data privacy is less important than algorithmic bias.'] },
            { id: 7, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'What specific ethical concern is highlighted in paragraph three?', options: ['A. The high cost of implementing AI across all schools.', 'B. The potential for teachers to become overly reliant on technology.', 'C. The possibility of a \'digital divide\' and issues of data transparency.', 'D. The lack of funding available for continued AI research.', 'E. The failure of AI to effectively grade essays and complex assignments.'] },
            { id: 8, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'What specific benefit does the passage mention AI is effective at providing?', options: ['A. Offering teachers higher salaries for using the technology.', 'B. Allowing students to completely avoid difficult subjects.', 'C. Freeing up educators to focus on complex skills and emotional development.', 'D. Guaranteeing that all students achieve the highest possible test scores.', 'E. Eliminating the need for any form of homework or exams.'] },
            { id: 9, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'What does the author suggest about policy development?', options: ['A. It must be created exclusively by technology developers.', 'B. It should focus narrowly on controlling data usage.', 'C. It is only required in schools located in low-income communities.', 'D. It is essential for ensuring the equity and transparency of AI implementation.', 'E. It can be replaced entirely by ongoing teacher professional development.'] },
            { id: 10, type: 'multiple_choice', section: 'Questions 1–10: AI in Education', question: 'What is the tone of the passage on AI in education?', options: ['A. Enthusiastic and aggressively promotional.', 'B. Measured and critical of all new technology.', 'C. Balanced and analytical regarding potential and challenges.', 'D. Humorous and light-hearted about serious issues.', 'E. Pessimistic and deeply skeptical of future success.'] },
            { id: 'passage2', type: 'reading_passage', title: 'Reading Comprehension Passage 2: Remote Work', content: `Remote work, once a niche arrangement for a few industries, has become a mainstream fixture in the global economy, accelerated by recent global events. This shift offers workers unprecedented flexibility, allowing many to achieve a better work-life balance and avoid the daily commute. Companies benefit from reduced overhead costs related to office space and gain access to a wider, geographically diverse talent pool.\nHowever, the transition presents new management challenges. Maintaining team cohesion and corporate culture can be difficult when interactions are primarily digital. Furthermore, the blurring of lines between home and office life can lead to overwork and burnout for employees who struggle to disconnect. Employers must implement clear communication protocols and establish boundaries to ensure productivity and employee well-being are maintained. The long-term success of remote models hinges on the effective deployment of collaborative technology and a cultural commitment to results over physical presence.`},
            { id: 11, type: 'multiple_choice', section: 'Questions 11–15: Remote Work', question: 'Which inference can best be drawn about the primary driver of the shift to widespread remote work?', options: ['A. The desire of companies to save money on reduced office space.', 'B. The necessity imposed by specific, recent international circumstances.', 'C. The gradual improvement of video conferencing technology.', 'D. Government subsidies encouraging employees to work from home.', 'E. A significant increase in the cost of commuting and gasoline.'] },
            { id: 12, type: 'multiple_choice', section: 'Questions 11–15: Remote Work', question: 'Considering both paragraphs, what conclusion best reflects the relationship between remote work and employee well-being?', options: ['A. Remote work automatically improves well-being by providing flexibility.', 'B. The blurred lines between work and home can lead to problems like overwork and burnout.', 'C. Employee well-being is not a primary concern for remote employers.', 'D. The lack of a daily commute is the single most important factor for good well-being.', 'E. Burnout is only an issue for employees who struggle with technology.'] },
            { id: 13, type: 'multiple_choice', section: 'Questions 11–15: Remote Work', question: 'What measure is explicitly mentioned as a requirement for employers to maintain productivity and employee well-being?', options: ['A. Providing free unlimited lunch deliveries to all remote staff.', 'B. Mandating all employees take a one-hour midday nap.', 'C. Implementing clear communication protocols and establishing boundaries.', 'D. Increasing the number of mandatory weekly team-building meetings.', 'E. Requiring that all work-related communication stops completely after 3 PM.'] },
            { id: 14, type: 'multiple_choice', section: 'Questions 11–15: Remote Work', question: 'What is the key factor upon which the long-term success of remote work models depends?', options: ['A. Securing massive reductions in global real estate prices.', 'B. A return to mandatory office attendance for all new hires.', 'C. Eliminating the need for any kind of collaborative technology.', 'D. A cultural commitment to results over physical presence and effective technology use.', 'E. The complete abolition of the 9-to-5 workday schedule.'] },
            { id: 15, type: 'multiple_choice', section: 'Questions 11–15: Remote Work', question: 'What is the main idea of the first paragraph about remote work?', options: ['A. Remote work is a temporary trend caused by new tax incentives.', 'B. The shift to remote work, accelerated by recent events, benefits both companies and employees.', 'C. The only real benefit of remote work is allowing employees to avoid traffic congestion.', 'D. Companies benefit more from the shift than individual workers do.', 'E. Remote work was always mainstream but went unnoticed until recently.'] },
            { id: 16, type: 'multiple_choice', section: 'Questions 16–20: Vocabulary', question: 'The complex data was difficult to __________, requiring an expert to simplify and explain the findings clearly.', options: ['A. hinder', 'B. amass', 'C. obfuscate', 'D. elucidate', 'E. bear'] },
            { id: 17, type: 'multiple_choice', section: 'Questions 16–20: Vocabulary', question: 'A sudden illness threatened to __________ the athlete\'s chances of competing in the final event.', options: ['A. elucidate', 'B. commence', 'C. enhance', 'D. amass', 'E. hinder'] },
            { id: 18, type: 'multiple_choice', section: 'Questions 16–20: Vocabulary', question: 'The public relations team worked hard to __________ the rumors that had been damaging the company\'s reputation.', options: ['A. dispel', 'B. commence', 'C. elucidate', 'D. block', 'E. caution'] },
            { id: 19, type: 'multiple_choice', section: 'Questions 16–20: Vocabulary', question: 'The explorers were determined to __________ enough provisions for the long journey across the vast, uninhabited desert.', options: ['A. dispense', 'B. hinder', 'C. commence', 'D. amass', 'E. blur'] },
            { id: 20, type: 'multiple_choice', section: 'Questions 16–20: Vocabulary', question: 'The students patiently waited for the professor to __________ the lecture on quantum mechanics.', options: ['A. dispel', 'B. amass', 'C. challenge', 'D. commence', 'E. baffle'] },
            { id: 21, type: 'multiple_choice', section: 'Questions 21–25: Tenses & Verb Forms', question: 'By the time the new policy was announced, the company __________ on the old system for over a year, causing many delays.', options: ['A. will have relied', 'B. has been relying', 'C. had been relying', 'D. is relying', 'E. were relying'] },
            { id: 22, type: 'multiple_choice', section: 'Questions 21–25: Tenses & Verb Forms', question: 'The manager noticed that the new employees __________ some initial difficulties, but they quickly adapted to the software.', options: ['A. have been experiencing', 'B. are experiencing', 'C. experience', 'D. were experiencing', 'E. had experienced'] },
            { id: 23, type: 'multiple_choice', section: 'Questions 21–25: Tenses & Verb Forms', question: 'Every time the software automatically __________ an update, the whole system unexpectedly slows down.', options: ['A. installed', 'B. has installed', 'C. installs', 'D. is installing', 'E. had installed'] },
            { id: 24, type: 'multiple_choice', section: 'Questions 21–25: Tenses & Verb Forms', question: 'She __________ her master’s thesis by next month, so she cannot take on any new assignments until then.', options: ['A. is finishing', 'B. will finish', 'C. finishes', 'D. will have finished', 'E. finished'] },
            { id: 25, type: 'multiple_choice', section: 'Questions 21–25: Tenses & Verb Forms', question: 'I sincerely apologize for the delay; I __________ to send the documents this morning, but I had an urgent client call.', options: ['A. am intending', 'B. have intended', 'C. had intended', 'D. was intending', 'E. intend'] },
            { id: 26, type: 'multiple_choice', section: 'Questions 26–30: Modals', question: 'Given the severity of the security breach, all users __________ change their passwords immediately to safeguard their accounts.', options: ['A. should', 'B. ought to', 'C. must', 'D. have to', 'E. need to'] },
            { id: 27, type: 'multiple_choice', section: 'Questions 26–30: Modals', question: 'If you want to reduce your energy bill, you __________ remember to switch off all electronic devices before leaving the room.', options: ['A. must', 'B. need', 'C. ought to', 'D. should', 'E. have to'] },
            { id: 28, type: 'multiple_choice', section: 'Questions 26–30: Modals', question: 'The company policy states that visitors __________ report to the reception desk immediately upon arrival.', options: ['A. should', 'B. must', 'C. ought to', 'D. need to', 'E. are'] },
            { id: 29, type: 'multiple_choice', section: 'Questions 26–30: Modals', question: 'If you plan to live abroad, you __________ obtain a valid work permit before accepting employment.', options: ['A. ought', 'B. should', 'C. must', 'D. need', 'E. have'] },
            { id: 30, type: 'multiple_choice', section: 'Questions 26–30: Modals', question: 'To effectively manage large teams, leaders __________ possess excellent communication skills and be able to delegate tasks.', options: ['A. ought to', 'B. should', 'C. have to', 'D. must', 'E. need'] },
            { id: 31, type: 'multiple_choice', section: 'Questions 31–35: Gerunds & Infinitives', question: 'The board unanimously agreed __________ the final decision until they had consulted with their legal counsel.', options: ['A. postponing', 'B. postpone', 'C. to postpone', 'D. to be postponing', 'E. having postponed'] },
            { id: 32, type: 'multiple_choice', section: 'Questions 31–35: Gerunds & Infinitives', question: 'He denied __________ the confidential information, claiming the leak must have come from another source.', options: ['A. to reveal', 'B. revealing', 'C. reveal', 'D. to be revealing', 'E. to have revealed'] },
            { id: 33, type: 'multiple_choice', section: 'Questions 31–35: Gerunds & Infinitives', question: 'I can’t afford __________ a new car right now; I have to save up for the down payment first.', options: ['A. buying', 'B. buy', 'C. to buy', 'D. to be buying', 'E. having bought'] },
            { id: 34, type: 'multiple_choice', section: 'Questions 31–35: Gerunds & Infinitives', question: 'The scientist kept __________ the experiment, even after several unsuccessful attempts, because she was confident in her theory.', options: ['A. to repeat', 'B. repeat', 'C. repeating', 'D. to be repeating', 'E. to have repeated'] },
            { id: 35, type: 'multiple_choice', section: 'Questions 31–35: Gerunds & Infinitives', question: 'The company postponed __________ the product launch until they could resolve the critical software bug.', options: ['A. to announce', 'B. announce', 'C. announcing', 'D. to be announcing', 'E. to have announced'] },
            { id: 36, type: 'multiple_choice', section: 'Questions 36–40: Conditionals & Passive Voice', question: 'If the government had invested more in public transport, city traffic __________ so congested today.', options: ['A. would have been', 'B. will be', 'C. is', 'D. would be', 'E. has been'] },
            { id: 37, type: 'multiple_choice', section: 'Questions 36–40: Conditionals & Passive Voice', question: 'Unless the security team increases its surveillance, valuable data __________ at risk of being stolen.', options: ['A. was', 'B. is', 'C. will remain', 'D. remained', 'E. had remained'] },
            { id: 38, type: 'multiple_choice', section: 'Questions 36–40: Conditionals & Passive Voice', question: 'The new research proposal __________ by the committee and is expected to receive funding.', options: ['A. has reviewed', 'B. was reviewed', 'C. reviewed', 'D. is reviewing', 'E. has been reviewing'] },
            { id: 39, type: 'multiple_choice', section: 'Questions 36–40: Conditionals & Passive Voice', question: 'The data analysis report __________ on time and has already been sent to all stakeholders.', options: ['A. has completed', 'B. was completed', 'C. completed', 'D. is completing', 'E. had completed'] },
            { id: 40, type: 'multiple_choice', section: 'Questions 36–40: Conditionals & Passive Voice', question: 'All mandatory training modules __________ by the end of the fiscal year, according to the new compliance rules.', options: ['A. will complete', 'B. are completing', 'C. will be completed', 'D. have completed', 'E. had been completed'] }
        ];

        let userAnswers = {};
        const quizContainer = document.getElementById('quiz-container');
        let currentSectionTitle = null;

        function renderQuiz() {
            quizContainer.innerHTML = '';
            QUIZ_DATA.forEach(item => {
                if (item.section && item.section !== currentSectionTitle) {
                    currentSectionTitle = item.section;
                    quizContainer.innerHTML += `<h2 class="text-xl sm:text-2xl font-bold text-indigo-700 mt-10 mb-4 border-b-2 border-indigo-200 pb-2">${currentSectionTitle}</h2>`;
                }
                if (item.type === 'reading_passage') {
                    quizContainer.innerHTML += `
                        <div class="mb-8 p-6 bg-gray-50 rounded-xl shadow-inner">
                            <h3 class="text-xl font-semibold mb-3 text-gray-800">${item.title}</h3>
                            <div class="passage-container text-gray-700 text-sm sm:text-base leading-relaxed">
                                <p>${item.content.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                const questionNumber = item.id;
                const questionHtml = `<p class="font-medium text-gray-800">${questionNumber}. ${item.question}</p>`;
                let optionsHtml = '';
                item.options.forEach(optionText => {
                    const letter = optionText.charAt(0);
                    const text = optionText.substring(3).trim();
                    optionsHtml += createOptionHtml(questionNumber, letter, `${letter}. ${text}`);
                });
                quizContainer.innerHTML += `
                    <div id="q-${questionNumber}" class="bg-white p-5 rounded-xl shadow-md border border-gray-200 fade-in" data-type="${item.type}">
                        <div class="text-base text-gray-600 mb-6 leading-relaxed">${questionHtml}</div>
                        <div class="space-y-3 mt-4" data-question-id="${questionNumber}">${optionsHtml}</div>
                    </div>
                `;
            });
            quizContainer.innerHTML += `
                <button onclick="checkAllAnswers()" class="w-full py-3 mt-12 mb-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-150 ease-in-out">
                    Check All Answers & Get Score
                </button>
            `;
            attachEventListeners();
        }

        function createOptionHtml(qId, letter, text) {
            return `
                <div class="quiz-option p-3 rounded-lg border-2 border-gray-300 flex items-center" data-question="${qId}" data-answer="${letter}">
                    <span class="text-sm font-semibold text-gray-800">${text}</span>
                </div>
            `;
        }

        function attachEventListeners() {
            document.querySelectorAll('.quiz-option').forEach(option => {
                option.addEventListener('click', handleOptionClick);
            });
            document.getElementById('results-section').classList.add('hidden');
        }

        function handleOptionClick(event) {
            const selectedOption = event.currentTarget;
            const qId = selectedOption.dataset.question;
            const answerLetter = selectedOption.dataset.answer;
            const container = selectedOption.closest(`[data-question-id="${qId}"]`);
            container.querySelectorAll('.quiz-option').forEach(option => { option.classList.remove('selected', 'correct', 'incorrect'); });
            selectedOption.classList.add('selected');
            userAnswers[qId] = answerLetter;
        }

        function checkAllAnswers() {
            let correctCount = 0;
            let totalQuestions = 0;
            for (const qId in CORRECT_ANSWERS) {
                totalQuestions++;
                const correctAnswer = CORRECT_ANSWERS[qId];
                const userAnswer = userAnswers[qId];
                const questionCard = document.getElementById(`q-${qId}`);
                if (!questionCard) continue;
                const optionsContainer = questionCard.querySelector(`[data-question-id="${qId}"]`);
                optionsContainer.querySelectorAll('.quiz-option').forEach(option => { option.classList.remove('correct', 'incorrect', 'selected'); });
                if (userAnswer) {
                    const isCorrect = userAnswer === correctAnswer;
                    const selectedOption = optionsContainer.querySelector(`[data-answer="${userAnswer}"]`);
                    if (selectedOption) {
                        selectedOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                        if (isCorrect) correctCount++;
                    }
                }
                if (userAnswers[qId] !== correctAnswer) {
                    const correctOption = optionsContainer.querySelector(`[data-answer="${correctAnswer}"]`);
                    if (correctOption) correctOption.classList.add('correct');
                }
            }
            const scoreDisplay = document.getElementById('score-display');
            const resultsSection = document.getElementById('results-section');
            scoreDisplay.textContent = `${correctCount} / ${totalQuestions} (${((correctCount / totalQuestions) * 100).toFixed(1)}%)`;
            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
