<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Grade Mock Exam Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f7f9fb; }
        .quiz-option { transition: all 0.2s; cursor: pointer; word-break: break-word; }
        .quiz-option:hover:not(.selected):not(.correct):not(.incorrect) { background-color: #eef2ff; }
        .selected { border-color: #4f46e5; background-color: #e0e7ff; }
        .correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .passage-container { max-height: 400px; overflow-y: auto; border-radius: 0.5rem; border: 1px solid #d1d5db; padding: 1rem; background-color: #ffffff; margin-bottom: 2rem; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <a href="index.html" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 font-semibold mb-6">
            &larr; Back to Home Menu
        </a>

        <header class="text-center mb-10 p-6 bg-indigo-600 text-white rounded-xl shadow-lg">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">X Grade Mock Exam Practice</h1>
            <p class="text-lg font-light mt-1 opacity-90">Ecotourism, Conditionals, and Vocabulary</p>
        </header>

        <main id="quiz-container" class="space-y-8">
            </main>

        <div id="results-section" class="mt-10 p-6 bg-white border-t-4 border-indigo-500 rounded-xl shadow-lg hidden">
            <h2 class="text-2xl font-bold text-indigo-700 mb-4">Quiz Results</h2>
            <p class="text-gray-700">Your current score is: <span id="score-display" class="text-indigo-600 font-extrabold text-xl"></span></p>
            <p class="text-sm text-gray-500 mt-2">Review your answers using the color-coded feedback above.</p>
        </div>
    </div>

    <script>
        const CORRECT_ANSWERS = {
            1: 'B', 2: 'C', 3: 'B', 4: 'A', 5: 'C', 6: 'B', 7: 'D', 8: 'D', 9: 'C', 10: 'D',
            11: 'C', 12: 'D', 13: 'D', 14: 'B', 15: 'C',
            16: 'B', 17: 'A', 18: 'B', 19: 'B', 20: 'D',
            21: 'A', 22: 'C', 23: 'B', 24: 'A', 25: 'C', 26: 'C', 27: 'C', 28: 'B', 29: 'D', 30: 'D'
        };

        const QUIZ_DATA = [
            { 
                id: 'passage', 
                type: 'reading_passage', 
                title: 'Reading Passage: The Global Rise of Ecotourism', 
                content: `Ecotourism, defined as responsible travel to natural areas that conserves the environment and improves the well-being of local people, has shifted from a niche concept to a major driver in the global travel industry. Central to this transformation is the understanding that natural environments are valuable economic assets only when their long-term health is guaranteed. This realization has prompted international bodies, including the United Nations, to promote sustainable practices vigorously.<br><br>The success of ecotourism hinges on several key elements. First, it requires minimizing the negative environmental impact of tourism activities, such as reducing waste and limiting infrastructure development in sensitive areas. Second, it must generate financial benefits for the protection of natural areas and for the local communities residing near them. This is often achieved through direct employment, educational initiatives, and funding for conservation efforts. In contrast, traditional mass tourism often results in leakage, where a significant portion of the money spent by tourists is directed out of the local economy to large international corporations.<br><br>However, challenges persist. Greenwashing, where companies falsely market their activities as environmentally friendly, confuses consumers and dilutes the ethical principles of true ecotourism. Furthermore, achieving an equitable balance between conservation mandates (which may restrict access) and community needs (which require economic income) often presents local governance conflicts. Education and certification schemes are essential tools for ensuring transparency and maintaining the integrity of the movement. Ultimately, the long-term viability of ecotourism depends on the collaborative efforts of governments, operators, and informed travelers.`
            },
            { id: 1, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'What can be inferred about the primary goal of ecotourism?', options: ['A. It is limited to maximizing tourist profits in developing nations.', 'B. It aims to make natural areas profitable while ensuring their preservation.', 'C. It exclusively funds research by international conservation groups.', 'D. It prohibits all forms of human infrastructure in natural reserves.', 'E. It relies mainly on government subsidies and taxes.'] },
            { id: 2, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'The author’s main purpose in describing \'greenwashing\' is to ______.', options: ['A. show that all tourism companies are inherently deceptive.', 'B. encourage consumers to spend more money on travel.', 'C. highlight an ongoing challenge to the ethical implementation of ecotourism.', 'D. argue that certification schemes are unnecessary for travelers.', 'E. compare the principles of conservation and economic benefit.'] },
            { id: 3, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'Which statement best reflects the author’s attitude toward the concept of ecotourism?', options: ['A. It is a temporary trend that will eventually fade.', 'B. It is a practical and necessary model, despite facing hurdles.', 'C. It is overly idealistic and conflicts with economic reality.', 'D. It is a niche idea irrelevant to the major global travel industry.', 'E. It is chaotic and inconsistent among different countries.'] },
            { id: 4, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'Why might sound be considered the most practical form of communication for dolphins?', options: ['A. It allows communication over great distances underwater.', 'B. It helps them identify colors and shapes in the ocean.', 'C. It prevents them from needing to see predators.', 'D. It can be transmitted only through surface vibrations.', 'E. It is used to release pheromones effectively.'] },
            { id: 5, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'The passage suggests that birdsong serves a dual purpose because it _____.', options: ['A. is used only for attracting mates', 'B. varies depending on emotional tone', 'C. can both warn others and claim territory', 'D. is similar in all species', 'E. occurs only during daylight'] },
            { id: 6, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'What conclusion can be drawn from the description of \'leakage\' in the passage?', options: ['A. Ecotourism is designed to maximize leakage for foreign investors.', 'B. Traditional mass tourism often fails to support local economies effectively.', 'C. Leakage is a key element of sustainable economic development.', 'D. Local communities rarely benefit from any form of tourism.', 'E. The United Nations strictly prohibits leakage in all travel markets.'] },
            { id: 7, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'The word "viability" in the final sentence most closely means the ability to...', options: ['A. increase profits exponentially', 'B. remain controversial and exclusive', 'C. adapt quickly to political changes', 'D. sustain success over a long period', 'E. rely solely on government funding'] },
            { id: 8, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'If companies falsely market their activities as eco-friendly, the phrasal verb that best replaces "falsely market" in this context is...', options: ['A. turn up', 'B. carry out', 'C. put off', 'D. make up', 'E. call off'] },
            { id: 9, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'The successful implementation of ecotourism requires a compromise between _____.', options: ['A. maximizing profits and attracting more tourists', 'B. local governance conflicts and international bodies', 'C. restricting access for conservation and ensuring local economic income', 'D. reducing waste and limiting all infrastructure development', 'E. international bodies and international corporations'] },
            { id: 10, type: 'multiple_choice', section: 'A. Reading Comprehension', question: 'What overall recommendation does the writer give regarding the success of ecotourism?', options: ['A. Focus exclusively on international government funding.', 'B. Prioritize reducing infrastructure development above all else.', 'C. Avoid involving local communities to maintain conservation integrity.', 'D. Encourage collaborative effort among all stakeholders.', 'E. Rely strictly on traditional mass tourism models.'] },
            
            { id: 11, type: 'multiple_choice', section: 'B. Conditionals and Tense', question: 'If the 2024 general election ___ next month, almost twice as many people say they ___ for the current incumbent as for the primary opposition candidate.', options: ['A. were held / would vote', 'B. was held / would have voted', 'C. is held / will vote', 'D. had been held / would vote', 'E. would hold / voted'] },
            { id: 12, type: 'multiple_choice', section: 'B. Conditionals and Tense', question: 'If you ___ someone dear to you with chronic pain, ___ them to ask their specialist about alternative therapy options.', options: ['A. have / encourage', 'B. have had / encouraging', 'C. had / encourage', 'D. know / encourage', 'E. had known / encouraged'] },
            { id: 13, type: 'multiple_choice', section: 'B. Conditionals and Tense', question: 'If I ___ in your situation last week, I ___ that she should deal with the financial problems herself.', options: ['A. were / would tell', 'B. am / will tell', 'C. was / would tell', 'D. had been / would have told', 'E. had been / would tell'] },
            { id: 14, type: 'multiple_choice', section: 'B. Conditionals and Tense', question: 'If they ___ the technology to your organization last year, they ___ already seeing the benefits now.', options: ['A. had sold / may see', 'B. had sold / might be seeing', 'C. sold / would see', 'D. sold / might see', 'E. have sold / might have seen'] },
            { id: 15, type: 'multiple_choice', section: 'B. Conditionals and Tense', question: '___, the team would have won the championship easily.', options: ['A. If the rain had not started', 'B. Unless they had changed their strategy', 'C. Had the star player not sustained the injury', 'D. If the coach has made an earlier substitution', 'E. Should the opponent play poorly'] },

            { id: 16, type: 'multiple_choice', section: 'C. Word Formation', question: 'Creative expression has always been a powerful form of human connection. Every (16) ___ (ART) hopes to touch people’s hearts through their creations.', options: ['A. artistry', 'B. artist', 'C. artistic', 'D. artful', 'E. artistically'] },
            { id: 17, type: 'multiple_choice', section: 'C. Word Formation', question: '...and each masterpiece carries a deep (17) ___ (MEAN) that reflects emotion, culture, and imagination.', options: ['A. meaning', 'B. meaningful', 'C. mean', 'D. meaningfully', 'E. meaningless'] },
            { id: 18, type: 'multiple_choice', section: 'C. Word Formation', question: 'When people admire a painting or listen to music, they often experience feelings of encouragement or even (18) ___ (SAD).', options: ['A. sadly', 'B. sadness', 'C. sad', 'D. sadnesses', 'E. sadden'] },
            { id: 19, type: 'multiple_choice', section: 'C. Word Formation', question: 'Their ability to transform simple ideas into beauty requires both talent and endless (19) ___ (PATIENT).', options: ['A. patient', 'B. patience', 'C. patiently', 'D. impatience', 'E. impatient'] },
            { id: 20, type: 'multiple_choice', section: 'C. Word Formation', question: 'Along the way, they face challenges that demand (20) ___ (PERSEVERE) and hard work.', options: ['A. persevering', 'B. persevere', 'C. persevered', 'D. perseverance', 'E. perseveringly'] },

            { id: 21, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'The study of substances, their composition, and reactions—known as ___ (21)—has led to the creation of medicines and countless materials we use daily.', options: ['A. Chemistry', 'B. dermatology', 'C. meteorology', 'D. ecology', 'E. physics'] },
            { id: 22, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'Understanding how the human heart, lungs, and brain interact belongs to the field of ___ (22), a discipline essential to both medicine and sports science.', options: ['A. Ornithology', 'B. zoology', 'C. physiology', 'D. dermatology', 'E. Microbiology'] },
            { id: 23, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'As the planet faces unpredictable weather patterns, experts in ___ (23) work tirelessly to forecast hurricanes and rising global temperatures.', options: ['A. Ornithology', 'B. meteorology', 'C. microbiology', 'D. ecology', 'E. physiology'] },
            { id: 24, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'Meanwhile, conservation programs depend heavily on ___ (24), which provides knowledge about animal species, their behavior, and their role in maintaining ecosystem balance.', options: ['A. zoology', 'B. microbiology', 'C. ecology', 'D. dermatology', 'E. physiology'] },
            { id: 25, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'In healthcare, ___ (25) investigates microscopic organisms that influence everything from food production to infectious diseases.', options: ['A. zoology', 'B. Ornithology', 'C. microbiology', 'D. physiology', 'E. dermatology'] },
            { id: 26, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'Which statement is the most assertive deduction based on the possibility of a past action?', options: ['A. He might finish his presentation quickly so that he can go home tonight.', 'B. They might have been delayed by the severe storm that hit the region yesterday.', 'C. She must have forgotten to upload the document; it\'s not in the shared folder.', 'D. We could finish the project on time if everyone contributes equally.', 'E. I will certainly attend the seminar even if the weather is poor.'] },
            { id: 27, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'Identify the sentence that contains a grammatical error in modal verb usage.', options: ['A. The experimental data can often have an unexpected result.', 'B. Slow economic growth is very likely to cause financial instability.', 'C. It might be improve the company\'s annual profit projections.', 'D. Re-engineering the product could reduce manufacturing costs significantly.', 'E. They will probably secure the necessary funding next quarter.'] },
            { id: 28, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'Which statement expresses a high degree of probability about a future event?', options: ['A. They might win the game if they practice hard every day.', 'B. She will most certainly complete the assignment before the deadline.', 'C. The team must perform perfectly to win the championship.', 'D. He could improve his score easily if he studies for a few hours.', 'E. The new policy can reduce operational waste effectively.'] },
            { id: 29, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'Identify the sentence with a grammatical error:', options: ['A. The system might become obsolete within the year.', 'B. It could disrupt the network\'s processing speed.', 'C. Low interest rates can often have the opposite effect on savings.', 'D. Fast tempos in music is very likely to improve your physical performance.', 'E. It\'ll most certainly help you process information faster.'] },
            { id: 30, type: 'multiple_choice', section: 'D. Specialized Vocabulary and Modals', question: 'The sudden lack of response from the headquarters ___ due to a widespread power outage; the storm was quite severe in that area.', options: ['A. should be', 'B. might be', 'C. can be', 'D. must have been', 'E. will be'] }
        ];

        let userAnswers = {};
        const quizContainer = document.getElementById('quiz-container');
        let currentSectionTitle = null;

        function renderQuiz() {
            quizContainer.innerHTML = '';
            QUIZ_DATA.forEach(item => {
                if (item.section && item.section !== currentSectionTitle) {
                    currentSectionTitle = item.section;
                    quizContainer.innerHTML += `<h2 class="text-xl sm:text-2xl font-bold text-indigo-700 mt-10 mb-4 border-b-2 border-indigo-200 pb-2">${currentSectionTitle}</h2>`;
                }

                if (item.type === 'reading_passage') {
                    quizContainer.innerHTML += `
                        <div class="mb-8 p-6 bg-gray-50 rounded-xl shadow-inner">
                            <h3 class="text-xl font-semibold mb-3 text-gray-800">${item.title}</h3>
                            <div class="passage-container text-gray-700 text-sm sm:text-base leading-relaxed">
                                <p>${item.content}</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                const questionNumber = item.id;
                const questionHtml = `<p class="font-medium text-gray-800">${questionNumber}. ${item.question}</p>`;
                let optionsHtml = '';

                item.options.forEach(optionText => {
                    const letter = optionText.charAt(0);
                    const text = optionText.substring(3).trim();
                    optionsHtml += createOptionHtml(questionNumber, letter, `${letter}. ${text}`);
                });

                quizContainer.innerHTML += `
                    <div id="q-${questionNumber}" class="bg-white p-5 rounded-xl shadow-md border border-gray-200 fade-in" data-type="${item.type}">
                        <div class="text-base text-gray-600 mb-6 leading-relaxed">${questionHtml}</div>
                        <div class="space-y-3 mt-4" data-question-id="${questionNumber}">${optionsHtml}</div>
                    </div>
                `;
            });

            quizContainer.innerHTML += `
                <button onclick="checkAllAnswers()" class="w-full py-3 mt-12 mb-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-150 ease-in-out">
                    Check All Answers & Get Score
                </button>
            `;

            attachEventListeners();
        }

        function createOptionHtml(qId, letter, text) {
            return `
                <div class="quiz-option p-3 rounded-lg border-2 border-gray-300 flex items-center" data-question="${qId}" data-answer="${letter}">
                    <span class="text-sm font-semibold text-gray-800">${text}</span>
                </div>
            `;
        }

        function attachEventListeners() {
            document.querySelectorAll('.quiz-option').forEach(option => {
                option.addEventListener('click', handleOptionClick);
            });
        }

        function handleOptionClick(event) {
            const selectedOption = event.currentTarget;
            const qId = selectedOption.dataset.question;
            const answerLetter = selectedOption.dataset.answer;
            const container = selectedOption.closest(`[data-question-id="${qId}"]`);
            container.querySelectorAll('.quiz-option').forEach(option => { option.classList.remove('selected', 'correct', 'incorrect'); });
            selectedOption.classList.add('selected');
            userAnswers[qId] = answerLetter;
        }

        function checkAllAnswers() {
            let correctCount = 0;
            let totalQuestions = 0;
            for (const qId in CORRECT_ANSWERS) {
                totalQuestions++;
                const correctAnswer = CORRECT_ANSWERS[qId];
                const userAnswer = userAnswers[qId];
                const questionCard = document.getElementById(`q-${qId}`);
                if (!questionCard) continue;
                const optionsContainer = questionCard.querySelector(`[data-question-id="${qId}"]`);
                optionsContainer.querySelectorAll('.quiz-option').forEach(option => { option.classList.remove('correct', 'incorrect', 'selected'); });
                if (userAnswer) {
                    const isCorrect = userAnswer === correctAnswer;
                    const selectedOption = optionsContainer.querySelector(`[data-answer="${userAnswer}"]`);
                    if (selectedOption) {
                        selectedOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                        if (isCorrect) correctCount++;
                    }
                }
                if (userAnswers[qId] !== correctAnswer) {
                    const correctOption = optionsContainer.querySelector(`[data-answer="${correctAnswer}"]`);
                    if (correctOption) correctOption.classList.add('correct');
                }
            }
            const scoreDisplay = document.getElementById('score-display');
            const resultsSection = document.getElementById('results-section');
            scoreDisplay.textContent = `${correctCount} / ${totalQuestions} (${((correctCount / totalQuestions) * 100).toFixed(1)}%)`;
            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.addEventListener('DOMContentLoaded', renderQuiz);
    </script>
</body>
</html>
