<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Club Holiday Special</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        /* --- BACKGROUND --- */
        body {
            background: url('fireplace.GIF') no-repeat center center fixed; 
            background-size: cover;
            font-family: sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- VIDEOTRON STYLE --- */
        .videotron-container {
            background-color: #000;
            border: 4px solid #333;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.6);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .neon-text {
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00de, 0 0 30px #ff00de, 0 0 40px #ff00de;
            animation: marquee 15s linear infinite;
        }

        @media (min-width: 768px) {
            .neon-text { font-size: 1.5rem; }
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .logo-img {
            height: 50px;
            width: 50px;
            object-fit: contain;
            z-index: 30;
            background: #000;
            border: 2px solid #333;
        }

        /* --- POSTER AREA --- */
        .poster-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
        }

        #main-poster {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
            z-index: 20; /* Poster on TOP */
            pointer-events: none; /* Click-through to face */
        }
        
        #user-face {
            position: absolute;
            top: 20%;
            left: 50%;
            width: 150px;
            cursor: grab;
            z-index: 10; /* Face BELOW poster */
            transform: translate(-50%, -50%);
        }

        #user-face:active { cursor: grabbing; }

        /* --- BUTTONS --- */
        .interactive-btn { transition: transform 0.2s, filter 0.2s; }
        .interactive-btn:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* --- MODAL SURAT --- */
        #message-box {
            background: url('message.JPG') no-repeat center center;
            background-size: 100% 100%;
            font-family: 'Great Vibes', cursive;
            color: #2d1a12;
            text-shadow: 0px 0px 1px rgba(255,255,255,0.3);
            line-height: 1.5;
        }

        /* --- NEW: PRESENT ANIMATION & SPARKLES --- */
        @keyframes fabulous-spin {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(1080deg); opacity: 1; } /* More spin for full screen! */
            100% { transform: scale(1) rotate(720deg); opacity: 1; }
        }

        .animate-reveal {
            animation: fabulous-spin 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .sparkle {
            position: absolute;
            width: 15px; /* Bigger sparkles for full screen */
            height: 15px;
            background-color: gold;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-fly 1.5s ease-out forwards;
            z-index: 100;
        }

        @keyframes sparkle-fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center py-6 px-4">

    <div class="w-full max-w-5xl flex items-center justify-center gap-0 mb-6">
        <img src="english club logo.PNG" alt="Logo" class="logo-img rounded-l-lg">
        <div class="videotron-container flex-grow h-[54px]"> 
            <div class="neon-text w-full text-center">
                THE ENGLISH CLUB IS EXTENDING A WARM GREETING TO YOU! &nbsp;&nbsp;&nbsp; MERRY CHRISTMAS!
            </div>
        </div>
        <img src="english club logo.PNG" alt="Logo" class="logo-img rounded-r-lg">
    </div>

    <div class="w-full flex flex-col items-center mb-8">
        <div class="poster-wrapper" id="drag-zone">
            <img id="user-face" src="" class="hidden" alt="User Face">
            <img src="funny poster.PNG" id="main-poster" alt="Funny Poster">
        </div>

        <div class="mt-4 bg-black/60 backdrop-blur-sm p-4 rounded-xl border border-white/20 text-center w-full max-w-sm">
            <label class="cursor-pointer inline-block bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-full shadow-lg transition mb-3">
                📸 Insert Your Face
                <input type="file" id="face-input" accept="image/*" class="hidden">
            </label>
            <div class="flex items-center justify-between gap-2 text-white text-xs font-bold">
                <span>Smaller</span>
                <input type="range" id="size-slider" min="50" max="400" value="150" class="w-full mx-2 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                <span>Bigger</span>
            </div>
            <p class="text-white/70 text-[10px] mt-2">Tip: Drag your photo to fit in the heart!</p>
        </div>
    </div>

    <div class="flex items-center justify-center gap-8 mb-10">
        <button onclick="openNameModal()" class="interactive-btn animate-bounce">
            <img src="mail.png" alt="Open Mail" class="w-28 h-28 object-contain drop-shadow-2xl">
        </button>
    </div>

    <div id="name-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 px-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full transform transition-all scale-100">
            <h3 class="text-xl font-bold text-gray-800 mb-2">You've got mail! 🎄</h3>
            <p class="mb-4 text-gray-600 text-sm">Please enter your name to open it:</p>
            <input type="text" id="visitor-name" placeholder="Your Name" class="w-full p-3 border-2 border-pink-200 rounded-xl mb-4 text-center text-lg focus:outline-none focus:border-pink-500">
            <button onclick="openMessage()" class="w-full bg-pink-500 text-white font-bold py-3 rounded-xl hover:bg-pink-600 shadow-md">Open Letter</button>
        </div>
    </div>

    <div id="message-modal-container" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div id="message-box" class="relative w-full max-w-2xl my-8 p-12 sm:px-20 sm:py-24 md:px-28 md:py-32 rounded-lg shadow-2xl flex flex-col items-center text-center overflow-y-auto max-h-[90vh]">
            
            <button onclick="closeMessage()" class="absolute top-4 right-4 bg-white/50 hover:bg-red-500 hover:text-white text-red-800 rounded-full w-10 h-10 flex items-center justify-center text-2xl font-bold transition-all shadow-sm z-50">
                &times;
            </button>
            
            <div id="message-content" class="mt-4 w-full">
                </div>
        </div>
    </div>

    <div id="revealOverlay" class="fixed inset-0 bg-black/90 z-[60] hidden flex-col items-center justify-center cursor-pointer" onclick="this.classList.add('hidden')">
        <div class="relative w-full flex justify-center items-center">
            <img src="wow.png" alt="WOW" class="w-full max-w-2xl h-auto object-contain animate-reveal drop-shadow-2xl">
            
            <div id="sparkleContainer" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>
        </div>
        
        <div class="mt-8 bg-white/90 backdrop-blur px-8 py-3 rounded-full border-4 border-pink-300 shadow-2xl animate-bounce z-50">
            <p class="text-xl text-gray-800 font-bold">
                Art by: 
                <a href="https://instagram.com/veli_.li" target="_blank" class="text-pink-600 hover:text-pink-800 hover:underline">
                    @veli_.li ✨
                </a>
            </p>
        </div>
        <p class="text-white/50 mt-6 text-sm animate-pulse">(Tap anywhere to close)</p>
    </div>

    <audio id="bg-music" loop autoplay>
        <source src="christmas-song.mp3" type="audio/mpeg">
    </audio>
    <audio id="voice-msg">
        <source src="audio message.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 0. AUDIO AUTO-PLAY HANDLING ---
        const bgMusic = document.getElementById('bg-music');
        const voiceMsg = document.getElementById('voice-msg');

        document.addEventListener('DOMContentLoaded', () => {
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay blocked. Waiting for interaction.");
                    const enableAudio = () => {
                        bgMusic.play();
                        document.removeEventListener('click', enableAudio);
                        document.removeEventListener('touchstart', enableAudio);
                    };
                    document.addEventListener('click', enableAudio);
                    document.addEventListener('touchstart', enableAudio);
                });
            }
        });

        // --- 1. SURPRISE REVEAL LOGIC ---
        function triggerSurprise() {
            const overlay = document.getElementById('revealOverlay');
            const container = document.getElementById('sparkleContainer');
            
            // Show Overlay
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            // Clear previous sparkles if any
            container.innerHTML = '';

            // Generate MASSIVE Sparkles
            for(let i=0; i<60; i++) { // Increased count for full screen effect
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                
                const colors = ['#FFD700', '#FF69B4', '#00BFFF', '#FFFFFF', '#FF4500'];
                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                // Wider explosion range
                const x = (Math.random() - 0.5) * window.innerWidth * 0.8; 
                const y = (Math.random() - 0.5) * window.innerHeight * 0.8; 
                
                sparkle.style.setProperty('--tx', `${x}px`);
                sparkle.style.setProperty('--ty', `${y}px`);
                
                // Start from center
                sparkle.style.left = '50%';
                sparkle.style.top = '50%';

                container.appendChild(sparkle);
            }
        }

        // --- 2. FACE DRAG & RESIZE LOGIC ---
        const faceInput = document.getElementById('face-input');
        const userFace = document.getElementById('user-face');
        const sizeSlider = document.getElementById('size-slider');
        const dragZone = document.getElementById('drag-zone');

        faceInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userFace.src = event.target.result;
                    userFace.classList.remove('hidden');
                    userFace.style.top = '30%';
                    userFace.style.left = '50%';
                }
                reader.readAsDataURL(file);
            }
        });

        sizeSlider.addEventListener('input', function() {
            userFace.style.width = this.value + 'px';
        });

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        dragZone.addEventListener('mousedown', startDrag);
        dragZone.addEventListener('touchstart', startDrag, {passive: false});
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag, {passive: false});
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        function startDrag(e) {
            if (userFace.classList.contains('hidden')) return;
            e.preventDefault();
            isDragging = true;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            startX = clientX;
            startY = clientY;
            const style = window.getComputedStyle(userFace);
            initialLeft = parseFloat(style.left);
            initialTop = parseFloat(style.top);
            userFace.style.cursor = 'grabbing';
        }

        function doDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            const dx = clientX - startX;
            const dy = clientY - startY;
            userFace.style.left = `${initialLeft + dx}px`;
            userFace.style.top = `${initialTop + dy}px`;
        }

        function stopDrag() {
            isDragging = false;
            userFace.style.cursor = 'grab';
        }

        // --- 3. LETTER & AUDIO LOGIC ---
        const nameModal = document.getElementById('name-modal');
        const messageModalContainer = document.getElementById('message-modal-container');
        const messageContent = document.getElementById('message-content');
        const nameInput = document.getElementById('visitor-name');

        function openNameModal() {
            nameModal.classList.remove('hidden');
            // Ensure bg music is playing if it wasn't already (user interaction)
            bgMusic.play().catch(() => {}); 
        }

        function playVoiceMessage() {
            // STOP background music completely
            bgMusic.pause();
            
            // Play voice message
            voiceMsg.currentTime = 0;
            voiceMsg.play();
        }

        function openMessage() {
            const name = nameInput.value.trim() || "Friend";
            
            messageContent.innerHTML = `
                <div class="text-center space-y-4 px-2">
                    <p class="text-2xl sm:text-3xl font-bold mb-4">Dearest ${name},</p>
                    
                    <p class="text-lg sm:text-xl">
                        As we twirl our way into the end of the year, I just want to say how much I adore each and every one of you. 
                        You’ve all brought sparkle, sass, curiosity, and so much joy into every meeting. 
                        Truly—you will always have a place in my heart: glitter, chaos, grammar mistakes, and all.
                    </p>

                    <p class="text-lg sm:text-xl hidden sm:block">
                        This season is the perfect moment to pause, sip something sweet, and reflect on our journey. 
                        We’ve made mistakes—yes, even the fabulously flawless among us—but that’s how we grow. 
                        Let’s learn from them, not hide from them.
                    </p>

                    <p class="text-lg sm:text-xl">
                        And please, my shining stars: don’t carry hate in your heart. People are different—some subtle, 
                        some dramatic, some fruity, some spicy—and that’s what makes the world interesting. 
                        Differences aren’t a reason to judge; they’re invitations to understand. 
                        So let’s focus on what we share, on what brings us together, not what pulls us apart.
                    </p>

                    <p class="text-lg sm:text-xl">
                        Thank you for making this year vibrant, memorable, and full of love.
                        Cheers to kindness, growth, and a fabulous 2026!
                    </p>

                    <div class="my-6">
                         <button onclick="playVoiceMessage()" class="bg-[#3e2723] text-white px-4 py-2 rounded-full shadow-lg hover:bg-black transition flex items-center justify-center gap-2 mx-auto font-sans text-sm animate-pulse">
                            🔊 Play Voice Message
                        </button>
                    </div>

                    <div class="mt-4">
                        <p class="text-lg sm:text-xl">Love,</p>
                        <p class="text-xl sm:text-3xl font-bold mt-2">Ms. Grace</p>
                    </div>
                </div>
            `;

            nameModal.classList.add('hidden');
            messageModalContainer.classList.remove('hidden');
        }

        function closeMessage() {
            // 1. Hide the letter
            messageModalContainer.classList.add('hidden');
            
            // 2. Stop voice message if it's still playing
            voiceMsg.pause();
            voiceMsg.currentTime = 0;
            
            // 3. Resume background music
            bgMusic.play();

            // 4. TRIGGER THE SURPRISE REVEAL!
            triggerSurprise();
        }

    </script>
</body>
</html>
