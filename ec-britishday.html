<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The "Proper British" Dialogue Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid #00247d; /* Union Jack Blue */
        }
        h1 { color: #cf142b; text-align: center; }
        .notice {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            background: #00247d;
            color: white;
        }
        button:hover { background: #001a57; }
        .reshuffle { background: #28a745; }
        .reshuffle:hover { background: #218838; }
        
        #dialogueBox {
            margin-top: 20px;
            padding: 20px;
            border-left: 5px solid #cf142b;
            background: #fafafa;
        }
        .line { margin-bottom: 15px; }
        .character-name { font-weight: bold; color: #00247d; }
        .theme-tag {
            display: inline-block;
            background: #eee;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇬🇧 The British Slang Generator</h1>
    
    <div class="notice">
        ⚠️ ATTENTION STUDENTS: You must perform these lines using your best (or worst) British accent. Don't be "codswallop," give it some "welly"!
    </div>

    <div class="controls">
        <button onclick="setTeamSize(2)">2 People Team</button>
        <button onclick="setTeamSize(3)">3 People Team</button>
        <button class="reshuffle" onclick="generateDialogue()">Reshuffle Dialogue 🎲</button>
    </div>

    <div id="dialogueBox">
        <p style="text-align:center;">Select team size to start the "banter"...</p>
    </div>
</div>

<script>
    let currentTeamSize = 2;

    const slangDict = {
        themes: [
            { title: "The Ruined Picnic", words: ["gutted", "knackered", "chuffed", "rubbish", "innit", "minging", "dodgy", "quid", "mate", "fancy"] },
            { title: "Waiting for the Bus", words: ["cheers", "bloody", "daft", "skint", "nosh", "proper", "tosser", "bob's your uncle", "full of beans", "porkies"] },
            { title: "At the Local Chippy", words: ["bevvy", "chips", "scrummy", "bloke", "bird", "wicked", "leg it", "muppet", "taking the biscuit", "zonked"] }
        ],
        templates: [
            "Listen mate, I'm absolutely {w1} because the weather is {w2}.",
            "Stop telling {porkies}, that's {w3} and you know it!",
            "I'm {w4} to bits with this new phone, cost me fifty {quid}.",
            "Don't be {w5}, just {w6} and we'll get there on time.",
            "That's {w7}! I wouldn't touch it with a bargepole, {innit}?",
            "Are you {w8}? You look like a total {muppet} doing that.",
            "Fancy some {nosh}? I'm {w9} and need a proper {bevvy}.",
            "Well, {w10}, we've managed to finish the project!",
            "I'm feeling {w1} today, let's go for a {w2} walk.",
            "That's {w3} taking the biscuit, honestly."
        ]
    };

    function setTeamSize(size) {
        currentTeamSize = size;
        generateDialogue();
    }

    function generateDialogue() {
        const box = document.getElementById('dialogueBox');
        const theme = slangDict.themes[Math.floor(Math.random() * slangDict.themes.length)];
        box.innerHTML = `<span class="theme-tag">Theme: ${theme.title}</span>`;

        let characters = ["Character A", "Character B"];
        if (currentTeamSize === 3) characters.push("Character C");

        let dialogueLines = [];
        
        // Generate 10 lines for EACH character
        characters.forEach(char => {
            for (let i = 0; i < 10; i++) {
                let text = slangDict.templates[i % slangDict.templates.length];
                // Replace placeholders with theme-specific slang
                theme.words.forEach((word, index) => {
                    text = text.replace(`{w${index+1}}`, `<strong>${word}</strong>`);
                });
                // Generic fallbacks
                text = text.replace("{porkies}", "<strong>porkies</strong>")
                           .replace("{innit}", "<strong>innit</strong>")
                           .replace("{quid}", "<strong>quid</strong>")
                           .replace("{muppet}", "<strong>muppet</strong>")
                           .replace("{nosh}", "<strong>nosh</strong>")
                           .replace("{bevvy}", "<strong>bevvy</strong>");

                dialogueLines.push({ name: char, line: text });
            }
        });

        // Shuffle the combined lines so it's a conversation
        for (let i = dialogueLines.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [dialogueLines[i], dialogueLines[j]] = [dialogueLines[j], dialogueLines[i]];
        }

        dialogueLines.forEach(item => {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = `<span class="character-name">${item.name}:</span> ${item.line}`;
            box.appendChild(div);
        });
    }
</script>

</body>
</html>
