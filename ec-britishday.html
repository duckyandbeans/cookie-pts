<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The "Proper British" Script Generator</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #222; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 10px solid #00247d; }
        h1 { text-align: center; color: #cf142b; margin-bottom: 10px; }
        .notice { background: #ffeb3b; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; border: 2px dashed #000; }
        .setup-section { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        .input-group { margin-bottom: 10px; }
        input { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: #00247d; color: white; }
        .btn-green { background: #28a745; color: white; display: none; }
        button:hover { opacity: 0.8; }
        #scriptArea { margin-top: 20px; display: none; }
        .script-line { margin-bottom: 12px; padding: 10px; border-bottom: 1px solid #eee; }
        .name-label { font-weight: bold; color: #cf142b; text-transform: uppercase; margin-right: 10px; }
        .slang { color: #00247d; font-weight: bold; text-decoration: underline; }
        .theme-header { background: #eee; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🇬🇧 British Banter Builder</h1>
    
    <div class="notice">
        🇬🇧 CHEEKY NOTICE: You MUST use a thick British accent. <br>
        If you sound like you're from London or Manchester, you're doing it right!
    </div>

    <div class="setup-section" id="setup">
        <h3>Step 1: How many in the team?</h3>
        <button class="btn-blue" onclick="showInputs(2)">2 People</button>
        <button class="btn-blue" onclick="showInputs(3)">3 People</button>

        <div id="nameInputs" style="margin-top: 20px; display: none;">
            <h4>Step 2: Enter Student Names</h4>
            <div id="inputContainer"></div>
            <button class="btn-green" id="genBtn" onclick="generateScript()">Generate Script for the Team</button>
        </div>
    </div>

    <div id="scriptArea">
        <div class="theme-header" id="themeDisplay"></div>
        <div id="lines"></div>
        <button class="btn-blue" style="margin-top: 20px; width: 100%;" onclick="generateScript()">🔀 Reshuffle This Scene</button>
    </div>
</div>

<script>
    let teamSize = 0;
    const themes = [
        { title: "Waiting in the Rain for a Bus", words: ["knackered", "bloody", "rubbish", "innit", "cheers", "mate", "gutted", "dodgy", "daft", "proper"] },
        { title: "At the Local Pub (The Winchester)", words: ["bevvy", "chuffed", "quid", "nosh", "bloke", "wicked", "leg it", "muppet", "zonked", "skint"] },
        { title: "A Disastrous Trip to London", words: ["porkies", "taking the biscuit", "fancy", "minging", "trolleyed", "barmy", "bob's your uncle", "full of beans", "rank", "tosser"] }
    ];

    const templates = [
        "Oi, I'm absolutely {w0} after that walk.",
        "Stop telling {w1}, you didn't see a ghost in the Tube!",
        "That sandwich was {w2}, I'm not even joking.",
        "It's going to rain again, {w3}?",
        "Give it some welly, {w4}! We're late!",
        "I'm {w5} to bits with this result, absolutely brilliant.",
        "That's a {w6} price for a coffee, five {w7}?!",
        "Don't be {w8}, it's just a bit of wind.",
        "Well, {w9}, we've finally made it.",
        "I'm feeling {w5} today, let's get a {w0} snack."
    ];

    function showInputs(size) {
        teamSize = size;
        const container = document.getElementById('inputContainer');
        const genBtn = document.getElementById('genBtn');
        container.innerHTML = '';
        for(let i=1; i<=size; i++) {
            container.innerHTML += `<div class="input-group">Student ${i}: <input type="text" id="name${i}" placeholder="Name"></div>`;
        }
        document.getElementById('nameInputs').style.display = 'block';
        genBtn.style.display = 'inline-block';
    }

    function generateScript() {
        const names = [];
        for(let i=1; i<=teamSize; i++) {
            const n = document.getElementById('name'+i).value || "Student " + i;
            names.push(n);
        }

        const scriptArea = document.getElementById('scriptArea');
        const linesDiv = document.getElementById('lines');
        const theme = themes[Math.floor(Math.random() * themes.length)];
        
        document.getElementById('themeDisplay').innerText = "THEME: " + theme.title;
        linesDiv.innerHTML = '';
        scriptArea.style.display = 'block';
        document.getElementById('setup').style.display = 'none';

        // Create 10 lines per person
        let allLines = [];
        names.forEach(name => {
            for(let j=0; j<10; j++) {
                let text = templates[j % templates.length];
                // Insert slang
                theme.words.forEach((word, index) => {
                    text = text.replace(`{w${index}}`, `<span class="slang">${word}</span>`);
                });
                allLines.push({owner: name, content: text});
            }
        });

        // Shuffle the order of lines so it's a back-and-forth conversation
        allLines = allLines.sort(() => Math.random() - 0.5);

        allLines.forEach(item => {
            linesDiv.innerHTML += `
                <div class="script-line">
                    <span class="name-label">${item.owner}:</span> 
                    <span>${item.content}</span>
                </div>
            `;
        });
    }
</script>

</body>
</html>
