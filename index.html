        /* --- 1. General Styles --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        select, input[type="text"], button {
            font-size: 16px;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }

        /* --- 2. Character & Dialogue Styles --- */
        .character-area {
            position: relative;
            width: 250px; /* The size of your character container */
            height: 250px;
            margin: 30px auto 0;
        }

        #character-img {
            width: 100%;
            height: 100%;
        }
        
        /* This is the new style for the text container */
        #dialogue-bubble {
            visibility: hidden; /* Stays hidden until search */
            
            /* This positions the text over the image */
            position: absolute;
            top: 45%;    /* Adjust this value to move text up or down */
            left: 60%;   /* Adjust this value to move text left or right */
            transform: translate(-50%, -50%); /* Centers the text block */
            
            /* Text alignment */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Size of the text area */
            width: 120px; /* Adjust this to fit the bubble */
        }

        /* This hides the old CSS bubble-tail */
        #dialogue-bubble::after {
            display: none;
        }

        /* This is the new style for the text itself */
        #points-display {
            font-size: 28px; /* Bigger, bolder font */
            font-weight: bold;
            color: #333; /* Dark gray text */
            text-align: center;
        }

        /* --- 3. Disclaimer Style --- */
        #disclaimer {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
        }
    </style>

        // --- 2. THE SEARCH FUNCTION ---
        function searchPoints() {
            const selectedClass = document.getElementById("classFilter").value;
            const studentId = document.getElementById("idSearch").value.trim();
            const bubble = document.getElementById("dialogue-bubble");
            const pointsDisplay = document.getElementById("points-display");

            if (!selectedClass || !studentId) {
                pointsDisplay.innerHTML = "Select class & ID!";
                bubble.style.visibility = "visible";
                return;
            }

            const classList = studentData[selectedClass];
            if (!classList) {
                pointsDisplay.innerHTML = "Class not found!";
                bubble.style.visibility = "visible";
                return;
            }

            const student = classList.find(s => s.id === studentId);

            if (student) {
                pointsDisplay.innerHTML = `${student.points} Points!`;
                bubble.style.visibility = "visible";
            } else {
                pointsDisplay.innerHTML = "ID not found.";
                bubble.style.visibility = "visible";
            }
        }
