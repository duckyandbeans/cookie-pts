<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH 2 Results Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f5f3ff 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl overflow-hidden border border-white/50 mt-10">
        
        <div class="bg-purple-600 p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 text-7xl opacity-20">📈</div>
            <h1 class="text-3xl font-extrabold text-white relative z-10">PH 2 Results</h1>
            <p class="text-purple-100 mt-2 relative z-10">Check your final scores and cookies</p>
        </div>

        <div class="p-8">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Select Your Class</label>
                    <select id="classSelect" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-gray-700 font-medium cursor-pointer">
                        <option value="">-- Choose Class --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Attendance Number</label>
                    <input type="number" id="idSearch" placeholder="e.g., 14" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-gray-700 font-medium">
                </div>
                
                <button onclick="handleSearch()" class="w-full bg-purple-600 text-white font-bold text-lg py-4 rounded-xl hover:bg-purple-700 hover:shadow-lg transition-all transform active:scale-95 flex justify-center items-center gap-2 mt-4">
                    <span>🔍</span> Reveal Score
                </button>
            </div>
        </div>

        <div id="resultArea" class="hidden border-t border-gray-100 bg-gray-50 p-8 text-center animate-fade-in">
            <p class="text-sm font-semibold text-purple-500 uppercase tracking-wider mb-1" id="studentClass">Class</p>
            <h3 id="studentName" class="text-2xl font-extrabold text-gray-800 mb-6">Student Name</h3>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Mistakes</p>
                    <p class="text-xl font-black text-red-500 mt-1" id="mistakesDisplay">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Raw Score</p>
                    <p class="text-xl font-black text-gray-700 mt-1" id="rawDisplay">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 col-span-2 flex justify-between items-center px-6">
                    <p class="text-sm text-gray-500 font-bold uppercase tracking-wide">Cookies Applied</p>
                    <p class="text-2xl font-black text-amber-500" id="cookieDisplay">+0</p>
                </div>
            </div>

            <div class="bg-purple-600 text-white rounded-2xl p-6 shadow-md border border-purple-500 inline-block w-full">
                <p class="text-sm text-purple-200 font-medium mb-1">Final Score</p>
                <div id="finalDisplay" class="text-6xl font-black tracking-tight">
                    100
                </div>
            </div>
        </div>

    </div>
    
    <div class="text-center mt-8 pb-10">
        <a href="index.html" class="text-purple-600 hover:text-purple-800 font-semibold text-sm transition-colors bg-white/50 px-4 py-2 rounded-full shadow-sm">
            &larr; Back to Main Menu

        // Transform array arrays into structured objects

        for (const [cls, students] of Object.entries(rawData)) {
            allData[cls] = students.map((s, index) => ({
                id: (index + 1).toString(),
                name: s[0],
                mistakes: s[1],
                raw: s[2],
                cookie: s[3],
                final: s[4]
            }));
        }

        // Populate Dropdown
        window.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('classSelect');
            Object.keys(allData).sort().forEach(cls => {
                select.innerHTML += `<option value="${cls}">${cls}</option>`;
            });
        });

        function handleSearch() {
            const cls = document.getElementById('classSelect').value;
            const id = document.getElementById('idSearch').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if(!cls || !id) {
                alert("Please select a class and enter your attendance number.");
                return;
            }

            const student = allData[cls]?.find(s => s.id === id);
            
            if(student) {
                document.getElementById('studentName').innerText = student.name;
                document.getElementById('studentClass').innerText = cls;
                
                // Handle missing/value errors gracefully
                let mistakes = (student.mistakes === "-" || student.mistakes === "#VALUE!") ? "N/A" : student.mistakes;
                let raw = (student.raw === "-" || student.raw === "#VALUE!") ? "N/A" : student.raw;
                let finalScore = (student.final === "-" || student.final === "#VALUE!") ? "Pending" : student.final;
                
                document.getElementById('mistakesDisplay').innerText = mistakes;
                document.getElementById('rawDisplay').innerText = raw;
                
                let cookieStr = student.cookie;
                document.getElementById('cookieDisplay').innerText = cookieStr.startsWith('-') ? cookieStr : `+${cookieStr}`;
                document.getElementById('cookieDisplay').className = cookieStr.startsWith('-') ? "text-2xl font-black text-red-500" : "text-2xl font-black text-amber-500";

                document.getElementById('finalDisplay').innerText = finalScore;

                resultArea.classList.remove('hidden');
            } else {
                resultArea.classList.add('hidden');
                alert("Student not found! Please check your class and number.");
            }
        }
    </script>
</body>
