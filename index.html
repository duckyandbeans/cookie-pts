<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Points Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #dbeafe 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl overflow-hidden border border-white/50 mt-10">
        
        <div class="bg-indigo-600 p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 text-7xl opacity-20">🍪</div>
            <h1 class="text-3xl font-extrabold text-white relative z-10">Cookie Points</h1>
            <p class="text-indigo-100 mt-2 relative z-10">Search your current cookie points</p>
        </div>

        <div class="p-8">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Select Your Class</label>
                    <select id="classSelect" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-gray-700 font-medium cursor-pointer">
                        <option value="">Loading Classes...</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Attendance Number</label>
                    <input type="number" id="idSearch" placeholder="e.g., 14" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-gray-700 font-medium">
                </div>
                
                <button onclick="handleSearch()" class="w-full bg-indigo-600 text-white font-bold text-lg py-4 rounded-xl hover:bg-indigo-700 hover:shadow-lg transition-all transform active:scale-95 flex justify-center items-center gap-2 mt-4">
                    <span>🔍</span> Check Cookie Pts
                </button>
            </div>
        </div>

        <div id="resultArea" class="hidden border-t border-gray-100 bg-gray-50 p-8 text-center animate-fade-in">
            <p class="text-sm font-semibold text-indigo-500 uppercase tracking-wider mb-1" id="studentClass">Class</p>
            <h3 id="studentName" class="text-2xl font-extrabold text-gray-800 mb-6">Student Name</h3>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 inline-block min-w-[200px]">
                <p class="text-sm text-gray-500 font-medium mb-2">Total Cookie Points</p>
                <div id="pointsDisplay" class="text-5xl font-black">
                    </div>
            </div>
        </div>

    </div>
    
    <div class="text-center mt-8">
        <a href="index.html" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm transition-colors bg-white/50 px-4 py-2 rounded-full shadow-sm">
            &larr; Back to Main Menu
        </a>
    </div>

    <script>
        let allData = null;

        // Load database on start
        window.addEventListener('DOMContentLoaded', () => {
            fetch('database.json')
                .then(res => res.json())
                .then(data => {
                    allData = data;
                    const select = document.getElementById('classSelect');
                    select.innerHTML = '<option value="">-- Choose Class --</option>';
                    Object.keys(data.classes).sort().forEach(cls => {
                        select.innerHTML += `<option value="${cls}">${cls}</option>`;
                    });
                })
                .catch(err => alert("Error: Could not load database.json."));
        });

        function handleSearch() {
            const cls = document.getElementById('classSelect').value;
            const id = document.getElementById('idSearch').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if(!cls || !id) {
                alert("Please select a class and enter your number.");
                return;
            }

            const student = allData.classes[cls]?.find(s => s.id === id);
            
            if(student) {
                // Update text
                document.getElementById('studentName').innerText = student.name;
                document.getElementById('studentClass').innerText = cls;
                
                const pointsDisplay = document.getElementById('pointsDisplay');
                let ptsString = student.pts;
                pointsDisplay.innerText = ptsString;

                // Color coding logic
                if (ptsString.includes('-')) {
                    pointsDisplay.className = "text-5xl font-black text-red-500"; // Negative
                } else if (ptsString === "0" || ptsString === "00.00" || ptsString === "0,0") {
                    pointsDisplay.className = "text-5xl font-black text-gray-400"; // Zero
                } else {
                    pointsDisplay.className = "text-5xl font-black text-emerald-500"; // Positive
                }

                resultArea.classList.remove('hidden');
                
            } else {
                resultArea.classList.add('hidden');
                alert("Student not found! Please check your class and number.");
            }
        }
    </script>
</body>
</html>
