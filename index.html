<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Table Styles */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1000px; /* Forces scroll on small screens */
        }
        th, td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #444;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
        }
        tr:last-child td { border-bottom: none; }
        
        /* Highlight Columns */
        .col-cookie { background-color: #e0f2fe; font-weight: bold; color: #0284c7; }
        .col-final { background-color: #dcfce7; font-weight: bold; color: #166534; }
        .col-alloc { background-color: #fff7ed; color: #9a3412; }

        .mascot-img { width: 100px; height: 100px; object-fit: contain; }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col xl:flex-row items-center justify-between gap-6 border-l-8 border-indigo-600">
            <div class="text-center xl:text-left">
                <h1 class="text-2xl font-extrabold text-gray-800">ESL Student Portal</h1>
                <p class="text-gray-500 text-sm mt-1">Check Scores & Practice Exams</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full xl:w-auto justify-center">
                
                <a href="quiz-x.html" class="flex-1 sm:flex-none text-center px-5 py-3 bg-amber-100 text-amber-700 font-bold rounded-xl hover:bg-amber-200 transition duration-200 shadow-sm border border-amber-200">
    🌱 X Mock Exam
</a>

                <a href="quiz-xi.html" class="flex-1 sm:flex-none text-center px-5 py-3 bg-emerald-100 text-emerald-700 font-bold rounded-xl hover:bg-emerald-200 transition duration-200 shadow-sm border border-emerald-200">
                    📝 XI Mock Exam
                </a>

                <a href="quiz-xii.html" class="flex-1 sm:flex-none text-center px-5 py-3 bg-rose-100 text-rose-700 font-bold rounded-xl hover:bg-rose-200 transition duration-200 shadow-sm border border-rose-200">
                    🎓 XII Mock Exam
                </a>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                <span class="bg-blue-100 text-blue-600 p-2 rounded-lg mr-3">📊</span> 
                Check PH 3 & Cookie Pts
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <select id="classSelect" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">Loading Classes...</option>
                </select>
                <input type="text" id="idSearch" placeholder="Enter Attendance Number" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="handleLogin()" class="bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition shadow-md">
                    Show My Report
                </button>
            </div>

            <div id="resultArea" class="hidden animate-fade-in">
                
                <div class="flex flex-col items-center mb-6">
                    <img src="character.PNG" alt="Mascot" class="mascot-img mb-2">
                    <h3 id="studentName" class="text-2xl font-bold text-gray-800">Student Name</h3>
                    <p id="studentClass" class="text-gray-500">Class</p>
                </div>

                <div class="table-container">
                    <table id="scoreTable">
                        <thead>
                            </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>

                <p id="lastUpdated" class="text-center text-xs text-gray-400 mt-6">Last updated...</p>
            </div>
        </div>

    </div>

    <script>
        let allData = null;

        // Load database on start
        window.addEventListener('DOMContentLoaded', () => {
            fetch('database.json')
                .then(res => res.json())
                .then(data => {
                    allData = data;
                    const select = document.getElementById('classSelect');
                    select.innerHTML = '<option value="">-- Select Class --</option>';
                    Object.keys(data.classes).sort().forEach(cls => {
                        select.innerHTML += `<option value="${cls}">${cls}</option>`;
                    });
                })
                .catch(err => alert("Error: Could not load database.json. Please ensure the file exists."));
        });

        function handleLogin() {
            const cls = document.getElementById('classSelect').value;
            const id = document.getElementById('idSearch').value.trim();
            
            if(!cls || !id) {
                alert("Please select a class and enter your number.");
                return;
            }

            const student = allData.classes[cls]?.find(s => s.id === id);
            
            if(student) {
                renderResult(student, cls);
            } else {
                alert("Student not found! Please check your class and number.");
            }
        }

        function renderResult(s, cls) {
            const resultArea = document.getElementById('resultArea');
            const thead = document.querySelector('#scoreTable thead');
            const tbody = document.querySelector('#scoreTable tbody');
            
            document.getElementById('studentName').innerText = s.name;
            document.getElementById('studentClass').innerText = "Class " + cls;
            document.getElementById('lastUpdated').innerText = "Last updated: " + allData.lastUpdated;

            // Determine if XII or XI for table structure
            let isXII = cls.startsWith('XII');

            // --- BUILD HEADERS ---
            let headersHTML = `
                <tr>
                    <th class="col-cookie">Total Cookie Pts</th>
            `;

            if(isXII) {
                headersHTML += `
                    <th>Cookies 4 PH3</th>
                    <th>Cookies 4 PH4</th>
                `;
            }

            headersHTML += `
                    <th class="col-alloc">Alloc TP 1</th>
                    <th class="col-alloc">Alloc TP 2</th>
                    <th class="col-alloc">Alloc TP 3</th>
            `;

            // REMOVED: Leftover Cookie Column

            headersHTML += `
                    <th>TP 1 (Org)</th>
                    <th>TP 2 (Org)</th>
                    <th>TP 3 (Org)</th>
                    <th class="col-final">TP 1 Final</th>
                    <th class="col-final">TP 2 Final</th>
                    <th class="col-final">TP 3 Final</th>
                </tr>
            `;
            thead.innerHTML = headersHTML;

            // --- BUILD ROW ---
            let rowHTML = `
                <tr>
                    <td class="col-cookie">${s.cookie_total}</td>
            `;

            if(isXII) {
                rowHTML += `
                    <td>${s.ph3 || 0}</td>
                    <td>${s.ph4 || 0}</td>
                `;
            }

            rowHTML += `
                    <td class="col-alloc">${s.alloc[0]}</td>
                    <td class="col-alloc">${s.alloc[1]}</td>
                    <td class="col-alloc">${s.alloc[2]}</td>
            `;

            // REMOVED: Leftover Cookie Data

            rowHTML += `
                    <td>${s.org[0]}</td>
                    <td>${s.org[1]}</td>
                    <td>${s.org[2]}</td>
                    <td class="col-final">${s.final[0]}</td>
                    <td class="col-final">${s.final[1]}</td>
                    <td class="col-final">${s.final[2]}</td>
                </tr>
            `;
            tbody.innerHTML = rowHTML;

            // Show result
            resultArea.classList.remove('hidden');
        }
    </script>
</body>
</html>
