<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Nilai Siswa</title>
    <style>
        /* --- 1. Style Dasar --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 95%;
            max-width: 600px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* --- 2. Kontrol Form --- */
        select, input[type="text"] {
            font-size: 16px;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            font-size: 16px;
            font-weight: 600;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button.secondary { background-color: #6c757d; }
        button.secondary:hover { background-color: #5a6268; }

        /* --- 3. Style Tampilan (Views) --- */
        #dashboardView { display: none; }
        
        /* --- 4. Style Maskot & Cookie --- */
        .character-area {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 10px auto;
        }
        #character-img { width: 100%; height: 100%; }
        #dialogue-bubble {
            position: absolute;
            top: 45%; left: 60%;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            width: 100px;
            text-align: center;
        }
        #cookie-display {
            font-size: 24px; font-weight: bold; color: #333;
        }
        .cookie-label { font-size: 12px; color: #666; font-weight: normal; }

        /* --- 5. Style Tabel --- */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th { background-color: #f8f9fa; color: #495057; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Highlight baris Cookie Pts di tabel */
        .row-cookie {
            background-color: #fff3cd !important;
            font-weight: bold;
        }

        .disclaimer { margin-top: 25px; font-size: 12px; color: #777; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="loginView">
            <h2>Portal Nilai Siswa</h2>
            <p>Silakan pilih kelas dan masukkan nomor absensi.</p>
            
            <select id="classSelect">
                <option value="">-- Memuat Kelas... --</option>
            </select>
            
            <input type="text" id="idSearch" placeholder="Masukkan nomor absensi...">
            <button id="searchBtn">Lihat Raport Lengkap</button>
        </div>

        <div id="dashboardView">
            <h2 id="studentName">Nama Siswa</h2>
            <p id="studentClass">Kelas</p>

            <div class="character-area">
                <img src="character.PNG" alt="Mascot" id="character-img">
                <div id="dialogue-bubble">
                    <div>
                        <div id="cookie-display">0</div>
                        <div class="cookie-label">Cookie Pts</div>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table id="scoreTable">
                    <thead>
                        <tr>
                            <th>Jenis Nilai</th>
                            <th>Skor</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

            <p id="lastUpdated" class="disclaimer">Last updated...</p>
            <button id="logoutBtn" class="secondary">Kembali / Keluar</button>
        </div>

    </div>

    <script>
        let allData = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetch('database.json')
                .then(res => res.json())
                .then(data => {
                    allData = data;
                    populateClasses();
                })
                .catch(err => alert("Gagal memuat data. Pastikan database.json ada."));

            document.getElementById('searchBtn').addEventListener('click', handleLogin);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        });

        function populateClasses() {
            const select = document.getElementById('classSelect');
            select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            Object.keys(allData.classes).sort().forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                select.appendChild(opt);
            });
        }

        function handleLogin() {
            const cls = document.getElementById('classSelect').value;
            const id = document.getElementById('idSearch').value.trim();
            
            if (!cls || !id) return alert("Mohon lengkapi data.");

            const student = allData.classes[cls]?.find(s => s.id === id);
            
            if (student) {
                showDashboard(student, cls);
            } else {
                alert("Siswa tidak ditemukan.");
            }
        }

        function showDashboard(student, cls) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            
            document.getElementById('studentName').textContent = student.name;
            document.getElementById('studentClass').textContent = "Kelas " + cls;
            document.getElementById('cookie-display').textContent = student.cookie;
            document.getElementById('lastUpdated').textContent = "Last updated on " + allData.lastUpdated;

            // Membangun Tabel
            const tbody = document.querySelector('#scoreTable tbody');
            tbody.innerHTML = '';

            // Tentukan Label TP berdasarkan Kelas
            let labels = ["TP 1", "TP 2", "TP 3"];
            if (cls.startsWith('XI ')) {
                labels = [
                    "TP 1 (Written Test 35-40 Qs)", 
                    "TP 2 (Speaking)", 
                    "TP 3 (Writing Opinion Essay)"
                ];
            } else if (cls.startsWith('XII ')) {
                labels = [
                    "TP 1 (Grammar Quiz 30 Qs)", 
                    "TP 2 (Sentence Translation 10 Qs)", 
                    "TP 3 (Statistic Summary)"
                ];
            }

            // Masukkan Baris TP
            const scores = [student.tp1, student.tp2, student.tp3];
            for(let i=0; i<3; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${labels[i]}</td><td>${scores[i]}</td>`;
                tbody.appendChild(tr);
            }

            // Masukkan Baris Cookie Pts (Highlight)
            const trCookie = document.createElement('tr');
            trCookie.className = 'row-cookie';
            trCookie.innerHTML = `<td>Original Cookie Pts</td><td>${student.cookie}</td>`;
            tbody.appendChild(trCookie);
        }

        function handleLogout() {
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('idSearch').value = '';
            document.getElementById('classSelect').value = '';
        }
    </script>
</body>
</html>
