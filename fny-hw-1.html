<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Grammar Fun!</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-color: #fce4ec; /* Pastel pink */
            --card-bg: #ffffff;
            --primary: #4fc3f7; /* Pastel blue */
            --secondary: #81c784; /* Pastel green */
            --text-color: #4a4a4a;
            --wrong: #e57373;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Checkpoint Tracker */
        .checkpoints {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .day {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            transition: all 0.3s;
        }

        .day.active { background-color: var(--primary); transform: scale(1.1); }
        .day.completed { background-color: var(--secondary); }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #eee;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Question UI */
        #question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        
        .option-btn { background-color: #f0f0f0; color: var(--text-color); }
        .option-btn:hover { background-color: #e0e0e0; }
        .option-btn.correct { background-color: var(--secondary); color: white; animation: pop 0.3s ease; }
        .option-btn.wrong { background-color: var(--wrong); color: white; }

        /* Explanation Box */
        .explanation {
            background-color: #fff9c4;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
            border-left: 4px solid #fbc02d;
        }

        /* Action Buttons */
        .action-btns { display: flex; gap: 10px; }
        .action-btns button { flex: 1; display: none; }
        #do-more-btn { background-color: #ab47bc; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* Login UI */
        #login-section {
            text-align: center;
            padding: 20px 0;
        }

        .dropdown {
            width: 100%;
            padding: 15px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            color: var(--text-color);
            outline: none;
            cursor: pointer;
        }

        .dropdown:focus {
            border-color: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="login-section">
            <h2>Welcome! 👋</h2>
            <p>Pilih namamu untuk mulai belajar:</p>
            
            <select id="user-select" class="dropdown">
                <option value="" disabled selected>-- Pilih Nama --</option>

            </select>

                <button id="login-btn" onclick="startApp(false)">Misi Harian</button>
                <button id="shuffle-btn" onclick="startApp(true)">Latihan Acak (Shuffle)</button>
            </div>
        </div>

        <!-- Monday to Sunday Checkpoints (HIDDEN BY DEFAULT) -->
        <div class="checkpoints" id="checkpoints" style="display: none;">

            <div class="day" id="day-2">T</div>
            <div class="day" id="day-3">W</div>
            <div class="day" id="day-4">T</div>
            <div class="day" id="day-5">F</div>
            <div class="day" id="day-6">S</div>
            <div class="day" id="day-7">S</div>
        </div>

        <!-- Progress Bar (HIDDEN BY DEFAULT) -->
        <div class="progress-bar" style="display: none;">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- Quiz Section (HIDDEN BY DEFAULT) -->
        <div id="quiz-section" style="display: none;">
            <div id="question-text">Loading question...</div>
            <div class="options-grid" id="options-container"></div>
            
            <div class="explanation" id="explanation-box"></div>

            <div class="action-btns">
                <button id="next-btn" onclick="nextQuestion()">Lanjut!</button>
                <button id="do-more-btn" onclick="doMore()">Kerjakan Lagi</button>
            </div>
        </div>
        
        <!-- Finish Section (HIDDEN BY DEFAULT) -->
        <div id="finish-section" style="display: none;">
            <h2>Kerja Bagus! 🎉</h2>
            <p>Kamu sudah menyelesaikan target hari ini.</p>
            <button id="do-more-finish-btn" onclick="doMore()">Kerjakan Lagi</button>
        </div>
        
    </div>

        { text: "She brings ___ umbrella because it's raining.", options: ["a", "an", "the"], answer: "an", explanation: "Gunakan 'an' karena kata 'umbrella' berawalan bunyi vokal (u)." },
        { text: "We see ___ big elephant at the zoo.", options: ["a", "an", "the"], answer: "a", explanation: "Walaupun 'elephant' berawalan vokal, kata setelah titik-titik adalah 'big' (konsonan). Jadi gunakan 'a'." },
        { text: "He lives in ___ small house.", options: ["a", "an", "the"], answer: "a", explanation: "Gunakan 'a' karena kata 'small' berawalan bunyi konsonan." },

        { text: "I ___ two brothers.", options: ["has", "have", "am"], answer: "have", explanation: "Untuk subjek I, You, They, We, kita selalu menggunakan 'have'." },
        { text: "She ___ a red car.", options: ["has", "have", "is"], answer: "has", explanation: "Untuk subjek orang ketiga tunggal (He, She, It), kita menggunakan 'has'." },
        { text: "They ___ a big garden.", options: ["has", "have", "are"], answer: "have", explanation: "Karena subjeknya 'They' (mereka), kita menggunakan 'have'." },
        { text: "He ___ short black hair.", options: ["has", "have", "is"], answer: "has", explanation: "Karena subjeknya 'He' (dia laki-laki), kita menggunakan 'has'." },

        { text: "It ___ cold outside.", options: ["am", "is", "are"], answer: "is", explanation: "Untuk membicarakan cuaca atau keadaan sekitar, kita gunakan 'It' dengan 'is'." },

    // ==========================================
    // 4. APP LOGIC & SESSION MANAGEMENT
    // ==========================================
    function startApp(isRandom) {
        const selectElement = document.getElementById('user-select');
        const selectedValue = selectElement.value;

        if (!selectedValue) {
            alert("Tolong pilih nama dulu ya!");
            return;
        }

        currentStudent = studentData[selectedValue];
        sessionId = selectedValue; 

        // Change button text while checking Firebase
        const loginBtn = isRandom ? document.getElementById('shuffle-btn') : document.getElementById('login-btn');
        const originalText = loginBtn.innerText;
        loginBtn.innerText = "Memuat data...";

        const today = new Date().toISOString().split('T')[0];

        // Check Firebase for an unfinished session today
        db.collection('sessions').doc(sessionId).get().then((doc) => {
            if (doc.exists && doc.data().date === today && !doc.data().isCompleted) {
                // RESUME PREVIOUS SESSION
                const data = doc.data();
                currentDailyQuestions = data.questions;
                currentIndex = data.currentIndex;
                score = data.score;
                
                showQuizUI();
                updateCheckpoints();
                renderQuestion();
            } else {
                // START A FRESH SESSION
                startNewSession(isRandom, today);
            }
        }).catch((error) => {
            console.error("Error fetching session:", error);
            alert("Gagal memuat sesi. Periksa koneksi internet.");
            loginBtn.innerText = originalText;
        });
    }

    function showQuizUI() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('checkpoints').style.display = 'flex';
        document.querySelector('.progress-bar').style.display = 'block';
        document.getElementById('quiz-section').style.display = 'block';
    }

    function startNewSession(isRandom, today) {
        if (isRandom) {
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
            currentDailyQuestions = shuffled.slice(0, 20);
        } else {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            const safeLimit = Math.min(20, allQuestions.length); 
            const startIndex = (dayOfYear % 5) * safeLimit; 
            currentDailyQuestions = allQuestions.slice(startIndex, startIndex + safeLimit);
            if(currentDailyQuestions.length === 0) {
                currentDailyQuestions = allQuestions.slice(0, safeLimit);
            }
        }

        currentIndex = 0;
        score = 0;

        // Save fresh session state to Firebase
        db.collection('sessions').doc(sessionId).set({
            date: today,
            questions: currentDailyQuestions,
            currentIndex: 0,
            score: 0,
            isCompleted: false,
            mode: isRandom ? 'shuffle' : 'daily'
        }).then(() => {
            showQuizUI();
            updateCheckpoints();
            renderQuestion();
        });
    }

    function updateCheckpoints() {
        let dayOfWeek = new Date().getDay();
        dayOfWeek = dayOfWeek === 0 ? 7 : dayOfWeek; 
        
        for(let i = 1; i <= 7; i++) {
            const el = document.getElementById(`day-${i}`);
            if(i === dayOfWeek) el.classList.add('active');
            if(i < dayOfWeek) el.classList.add('completed');
        }
    }

    function renderQuestion() {
        if (currentIndex >= currentDailyQuestions.length) {
            finishDaily();
            return;
        }

        const q = currentDailyQuestions[currentIndex];
        document.getElementById('question-text').innerText = q.text;
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(btn, opt, q.answer, q.explanation);
            optionsContainer.appendChild(btn);
        });

        updateProgress();
    }

    function selectAnswer(btn, selected, correct, explanation) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true); // Lock buttons

        if (selected === correct) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }

        const expBox = document.getElementById('explanation-box');
        expBox.innerHTML = `<strong>Penjelasan:</strong> ${explanation}`;
        expBox.style.display = 'block';
        
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        document.getElementById('next-btn').style.display = 'none';

        // Update current progress in Firebase
        db.collection('sessions').doc(sessionId).update({
            currentIndex: currentIndex,
            score: score
        }).then(() => {
            renderQuestion();
        }).catch((err) => {
            console.error("Error saving progress:", err);
            renderQuestion();
        });
    }

    function updateProgress() {
        const percentage = (currentIndex / currentDailyQuestions.length) * 100;
        document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    function finishDaily() {
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('finish-section').style.display = 'block';
        document.getElementById('progress-fill').style.width = `100%`;
        
        // Lock the session so a refresh won't reload it
        if (sessionId) {
            db.collection('sessions').doc(sessionId).update({
                isCompleted: true
            });
        }

        saveToFirebase();
    }

    function doMore() {
        document.getElementById('finish-section').style.display = 'none';
        const today = new Date().toISOString().split('T')[0];
        startNewSession(true, today); 
    }

    function saveToFirebase() {
        const user = auth.currentUser;
        if(user && currentStudent) {
            db.collection('results').add({
                userId: user.uid,
                studentId: sessionId,
                studentName: currentStudent.name,
                studentEmail: currentStudent.email,
                date: new Date().toISOString().split('T')[0],
                score: score,
                totalQuestions: currentDailyQuestions.length,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                console.log("Result saved for", currentStudent.name);
            }).catch(err => {
                console.error("Error saving result: ", err);
            });
        } else {
            console.log("User not logged in or student not selected.");
        }
    }
    </script>
